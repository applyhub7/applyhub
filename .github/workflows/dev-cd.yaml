name: Dev CD

on:
  push:
    branches:
      - dev
    paths:
      - "apps/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: applyhub

jobs:
  detect-changes:
    name: Change Detection
    uses: ./.github/workflows/reusable-detect-changes.yaml

  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      base_name: ${{ steps.name.outputs.base_name }}
    steps:
      - name: Prepare image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Prepare base image name
        id: name
        run: echo "base_name=${{ vars.DOCKER_USER }}/${{ env.APP_NAME }}" >> "$GITHUB_OUTPUT"

  build-push-images:
    name: Build and Push Images
    needs: [detect-changes, prepare]
    if: needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != ''
    strategy:
      fail-fast: true
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: "apps/${{ matrix.service }}"
          push: true
          tags: ${{ needs.prepare.outputs.base_name }}-${{ matrix.service }}:${{ needs.prepare.outputs.tag }}
