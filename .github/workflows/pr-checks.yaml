name: PR Checks

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        uses: dorny/paths-filter@v3
        id: detect
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
            api-gateway:
              - 'apps/api-gateway/**'
            auth-service:
              - 'apps/auth-service/**'
            application-service:
              - 'apps/application-service/**'
            job-service:
              - 'apps/job-service/**'

  frontend:
    needs: detect-changes
    if: contains(fromJson(needs.detect-changes.outputs.services), 'frontend')
    uses: ./.github/workflows/reusable-node-checks.yaml
    with:
      working-directory: apps/frontend
      run-build: true

  api-gateway:
    needs: detect-changes
    if: contains(fromJson(needs.detect-changes.outputs.services), 'api-gateway')
    uses: ./.github/workflows/reusable-node-checks.yaml
    with:
      working-directory: apps/api-gateway

  auth-service:
    needs: detect-changes
    if: contains(fromJson(needs.detect-changes.outputs.services), 'auth-service')
    uses: ./.github/workflows/reusable-node-checks.yaml
    with:
      working-directory: apps/auth-service

  application-service:
    needs: detect-changes
    if: contains(fromJson(needs.detect-changes.outputs.services), 'application-service')
    uses: ./.github/workflows/reusable-node-checks.yaml
    with:
      working-directory: apps/application-service

  job-service:
    needs: detect-changes
    if: contains(fromJson(needs.detect-changes.outputs.services), 'job-service')
    uses: ./.github/workflows/reusable-python-checks.yaml
    with:
      working-directory: apps/job-service

  pr-checks-gate:
    needs:
      - detect-changes
      - frontend
      - api-gateway
      - auth-service
      - application-service
      - job-service
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report result
        run: |
          results='${{ toJson(needs) }}'
          echo "$results"

          if echo "$results" | jq -e '.[] | select(.result == "failure" or .result == "cancelled")' >/dev/null; then
            echo "FAILED - one or more services failed checks"
            exit 1
          fi

          echo "PASSED - all required service checks completed successfully"
