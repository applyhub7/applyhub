name: Workflows Lint

on:
  pull_request:
    branches: [dev, main]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  workflows-lint:
    name: Workflows Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: actionlint
        uses: devops-actions/actionlint@v0.1.12
