name: Detect changes

on:
  workflow_call:
    outputs:
      services:
        value: ${{ jobs.detect-changes.outputs.services }}

jobs:
  detect-changes:
    name: Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Paths filter
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            frontend: 'apps/frontend/**'
            api-gateway: 'apps/api-gateway/**'
            auth-service: 'apps/auth-service/**'
            application-service: 'apps/application-service/**'
            job-service: 'apps/job-service/**'
